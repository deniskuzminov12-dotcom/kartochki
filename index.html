<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Артефакты">
  <title>Артефакты — карточная коллекция</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">КАРТОЧНАЯ КОЛЛЕКЦИЯ</p><h1>Артефакты</h1></div>
      <button id="authButton" class="account-button" type="button">Войти</button>
    </header>
    <p id="authStatus" class="auth-status">Прогресс сохраняется на этом устройстве</p>
    <section class="stats-card">
      <div><span class="muted">Собрано</span><strong id="collectionCount">0 / 24</strong></div>
      <div class="collection-track"><span id="collectionBar"></span></div>
      <div class="coins"><span class="coin">◆</span><strong id="coinsLabel">100</strong></div>
    </section>
    <section class="case-panel">
      <div class="case-art"><span>✦</span></div>
      <div class="case-copy"><p class="eyebrow">СЕЙЧАС ДОСТУПНО</p><h2>Кейс исследователя</h2><p>Открой кейс и найди артефакт. Чем реже карта, тем меньше шанс её получить.</p><button id="openCaseButton" class="primary-button" type="button">Открыть кейс <span class="button-cost">◆ 20</span></button><p id="caseHint" class="case-hint">Первый кейс сегодня — бесплатно</p></div>
    </section>
    <section id="revealPanel" class="reveal-panel" hidden><p class="eyebrow">ТВОЯ НАХОДКА</p><div id="revealedCard" class="revealed-card"></div><button id="closeRevealButton" class="small-button" type="button">В коллекцию</button></section>
    <section class="collection-section"><div class="section-heading"><div><p class="eyebrow">ТВОИ КАРТЫ</p><h2>Коллекция</h2></div><span id="duplicateLabel" class="duplicate-label">Дубликаты: 0</span></div><div class="rarity-tabs" role="tablist"><button class="rarity-tab active" data-filter="all" type="button">Все</button><button class="rarity-tab" data-filter="common" type="button">Обычные</button><button class="rarity-tab" data-filter="rare" type="button">Редкие</button><button class="rarity-tab" data-filter="epic" type="button">Эпические</button><button class="rarity-tab" data-filter="legendary" type="button">Легенды</button></div><div id="collectionGrid" class="collection-grid"></div></section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
